<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Food Balls</title>
    <link rel="stylesheet" href="practice.css">
</head>
<body>
    <main class="ball-stage" aria-label="Ten bouncing food balls">
        <div class="ball ball-1" role="img" aria-label="Apple ball">🍎</div>
        <div class="ball ball-2" role="img" aria-label="Pizza ball">🍕</div>
        <div class="ball ball-3" role="img" aria-label="Burger ball">🍔</div>
        <div class="ball ball-4" role="img" aria-label="Taco ball">🌮</div>
        <div class="ball ball-5" role="img" aria-label="Donut ball">🍩</div>
        <div class="ball ball-6" role="img" aria-label="Watermelon ball">🍉</div>
        <div class="ball ball-7" role="img" aria-label="French fries ball">🍟</div>
        <div class="ball ball-8" role="img" aria-label="Ice cream ball">🍦</div>
        <div class="ball ball-9" role="img" aria-label="Sushi ball">🍣</div>
        <div class="ball ball-10" role="img" aria-label="Cookie ball">🍪</div>
    </main>
</body>
</html>
